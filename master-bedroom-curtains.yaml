substitutions:
  name: master-bedroom-curtains
  friendly_name: "Master Bedroom Curtains"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "Zemismart ZM-CL02 curtain motor, converted from Tasmota"

esp8266:
  # Chip reports 2MB flash (FlashChipId 1540C8), but esp01_1m (1MB board
  # profile) is the well-tested convention for this exact WB2S-style
  # Tuya curtain module family - it only under-uses the chip, it doesn't
  # risk anything, so we deliberately don't chase an exact 2MB board id.
  board: esp01_1m

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fall back to AP mode if wifi fails, so a bad flash is still recoverable.
  ap:
    ssid: "${friendly_name} Fallback"

logger:

api:
  encryption:
    key: !secret master_bedroom_curtains_api_key

ota:
  - platform: web_server
  - platform: esphome

web_server:

# --- Tuya MCU link -----------------------------------------------------
# From the Tasmota template {"GPIO":[...,108(idx9),...,107(idx11),...]}:
#   idx 9  -> GPIO13 -> Tasmota code 108 "Tuya Rx"  -> ESP RX
#   idx 11 -> GPIO15 -> Tasmota code 107 "Tuya Tx"  -> ESP TX
# These are the swapped-UART pins Tasmota used to talk to the Tuya MCU;
# GPIO1/GPIO3 remain free and are the normal pins used for serial flashing.
uart:
  id: tuya_uart
  tx_pin: GPIO15
  rx_pin: GPIO13
  baud_rate: 9600

tuya:
  id: curtain_tuya

cover:
  - platform: tuya
    # Empty name marks this as the device's "main" entity, so Home
    # Assistant uses the device name alone for the entity_id
    # (cover.master_bedroom_curtains) instead of concatenating the
    # entity's own name onto it (which doubled up since this entity's
    # name and the device's friendly_name were identical text).
    name: ""
    device_class: curtain
    position_datapoint: 101
    min_value: 0
    max_value: 100
    restore_mode: RESTORE
    # Deliberately NOT setting control_datapoint (dp 102 on this device).
    # The Tasmota rules show this device's dp102 enum is CLOSE=0/OPEN=1/STOP=2,
    # but ESPHome's tuya cover hardcodes OPEN=0/STOP=1/CLOSE=2 for
    # control_datapoint - using it as-is would send inverted open/close/stop
    # commands. Omitting it makes ESPHome drive open/close purely via
    # position_datapoint (0/100), and "stop" by re-sending the current
    # position.
    #
    # dp101 polarity (0=open, 100=closed, linear) was confirmed live on the
    # physical unit on 2026-09-12 by sending raw datapoint writes directly
    # (Tasmota `TuyaSend2 101,<value>`, bypassing Tasmota's own `Dimmer`
    # command and its `dimmerrange 1,100` clamp) and visually observing the
    # result: raw 0 -> fully open, raw 100 -> fully closed, raw 30 -> ~30%
    # closed. This matches ESPHome's default (non-inverted) position math,
    # so no invert_position_report is needed.
    #
    # Do not trust this device's `Dimmer` status value or the old Tasmota
    # rules' 0/100 assumptions in isolation - during testing the motor's
    # tracked position was observed stale/desynced from true physical
    # position after being driven by a raw open/close command (dp102) rather
    # than a position write (dp101). These curtain motors self-calibrate
    # their endstops on the first move in each direction after power-on, so
    # a position reading taken before both directions have been freshly
    # exercised in the current power cycle can't be trusted either. Driving
    # everything through position_datapoint (as this config does, since
    # control_datapoint is unset) avoids the raw-command desync path.
    #
    # dp11 (Tasmota's fake Power1, via `tuyaMCU 1,11`) is intentionally left
    # unmapped - it only existed to satisfy Tasmota's own relay bookkeeping
    # and its function on the real MCU is unknown/unused.
    #
    # Live-tested end to end on this exact unit after flashing: open (1.0),
    # close (0.0), and a partial position (0.5) all landed correctly, and
    # sending stop mid-travel (opening from 0.5, stopped ~1.5s later)
    # actually halted the motor around 0.67 instead of running to the
    # commanded 1.0 - confirming the resend-current-position stop trick
    # works on this hardware, not just in theory.
