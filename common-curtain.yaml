esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "Zemismart ZM-CL02 curtain motor"

esp8266:
  board: esp01_1m

logger:

api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}

captive_portal:

uart:
  id: tuya_uart
  tx_pin: GPIO15
  rx_pin: GPIO13
  baud_rate: 9600

tuya:
  id: curtain_tuya

cover:
  - platform: tuya
    name: ""
    device_class: curtain
    position_datapoint: 101
    min_value: 0
    max_value: 100
    restore_mode: RESTORE

switch:
  - platform: tuya
    name: "Curtain Direction"
    switch_datapoint: 103
    restore_mode: ${direction_restore}
    internal: true
